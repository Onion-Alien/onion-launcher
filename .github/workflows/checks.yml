name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy scan and UTC commit times
    runs-on: ubuntu-latest
    steps:
      # the PR's own commits, not GitHub's test merge (which is stamped in the
      # account's time zone and is never part of the history)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan every file and commit message in the history
        run: python3 scripts/check_sensitive.py --history
      - name: Commit times in UTC
        run: sh scripts/checks/check_utc.sh HEAD

  build:
    name: Build, Clippy and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable with Clippy
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version
      - name: Build (release)
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
